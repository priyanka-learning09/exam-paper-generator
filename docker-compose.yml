services:
  db:
    image: pgvector/pgvector:pg16
    container_name: qpg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qpg_user
      POSTGRES_PASSWORD: qpg_pass
      POSTGRES_DB: qpg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db

volumes:
  pgdata: